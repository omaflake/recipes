# Recipe nixos/lab – how a VM from it runs; what is inside it is default.nix next to this file.
# Fields: see CONTRIBUTING.md at the root of this repository.
# Development recipe: all integrations on, test app and debug tools, fresh at every start

"$schema" = "https://omaflake.dev/schema/recipe/v1.json"
systems = ["aarch64-linux"] # what it can be built for: aarch64-linux, x86_64-linux | aarch64-darwin
author = "omaflake"
license = "MIT"
display = "gpu"
description = "For developing omaflake: the omaflake Test app (camera, sound, microphone, clipboard) and debug tools; fresh at every start."
description_de = "Zum Entwickeln von omaflake: die App omaflake Test (Kamera, Ton, Mikrofon, Zwischenablage) und Debug-Werkzeuge; bei jedem Start frisch."
tags = ["development", "test"]
lab = true             # development recipe: shown only in developer mode
cpus = 4
memory_gb = 8
disk_gb = 60
network = "shared"
share = true
ephemeral = true
camera = true
microphone = true
